<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Result - Nanba Na</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to right, #00c6ff, #0072ff);
      color: #333;
      text-align: center;
      padding: 50px;
      margin: 0;
    }

    .result-container {
      display: inline-block;
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.2);
      animation: fadeIn 0.8s ease-out;
      max-width: 650px;
      width: 95%;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      font-size: 2rem;
      color: #0072ff;
      margin-bottom: 20px;
    }

    .tag {
      font-size: 1.25rem;
      margin-top: 15px;
      color: #222;
    }

    .score {
      font-size: 1.1rem;
      color: #009688;
      margin-top: 10px;
    }

    .recommendation {
      font-size: 1.3rem;
      margin-top: 20px;
      font-weight: bold;
      color: #d63384;
    }

    .highlight {
      font-weight: bold;
      color: #0072ff;
    }

    a {
      margin-top: 25px;
      display: inline-block;
      background-color: #007bff;
      color: white;
      padding: 10px 25px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.3s ease, transform 0.3s ease;
    }

    a:hover {
      background-color: #0056b3;
      transform: scale(1.05);
    }

    canvas {
      margin-top: 30px;
      max-width: 400px;
    }

    .tooltip {
      font-size: 0.85rem;
      color: #555;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="result-container">
    <h2>🧠 Sentiment Analysis Result</h2>
    
    <div class="tag"><strong>Text:</strong> {{ text }}</div>
    
    <div class="tag"><strong>Sentiment:</strong> <span class="highlight">{{ sentiment }}</span></div>
    
    <div class="score"><strong>Confidence Score:</strong> {{ score }}%</div>

    {% if recommendation %}
    <!-- ✅ Buy/Do Not Buy Recommendation -->
    <div class="recommendation">{{ recommendation }}</div>
    <div class="tooltip">Based on customer review sentiment.</div>
    {% endif %}

    <canvas id="sentimentChart"></canvas>

    <a href="/">🔁 Try Another</a>
  </div>

  <script>
    const sentiment = "{{ sentiment }}";
    const score = parseFloat("{{ score }}");

    const data = {
      labels: [sentiment, "Other"],
      datasets: [{
        label: "Sentiment Confidence",
        data: [score, 100 - score],
        backgroundColor: [
          sentiment === "POSITIVE" ? "#28a745" :
          sentiment === "NEGATIVE" ? "#dc3545" :
          "#ffc107",
          "#dee2e6"
        ],
        borderWidth: 1
      }]
    };

    new Chart(document.getElementById('sentimentChart'), {
      type: 'doughnut',
      data: data,
      options: {
        responsive: true,
        plugins: {
          legend: {
            position: 'bottom'
          }
        }
      }
    });
  </script>
</body>
</html>
