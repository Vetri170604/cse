<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sentiment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1f1f1f, #2c3e50);
      color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: bold;
      color: #00d9ff;
    }
    .form-control {
      font-size: 1rem;
      background-color: #333;
      border: 1px solid #555;
      color: #fff;
    }
    .form-control::placeholder {
      color: #aaa;
    }
    .btn-analyze {
      background-color: #007bff;
      border: none;
      padding: 10px 30px;
      font-size: 1.1rem;
      font-weight: 500;
      border-radius: 50px;
      transition: all 0.3s ease;
    }
    .btn-analyze:hover {
      background-color: #0056b3;
      transform: scale(1.05);
    }
    .alert-info {
      background-color: #0dcaf0;
      color: #000;
      border-radius: 12px;
      font-weight: bold;
    }
    .container {
      max-width: 600px;
    }
    .section-title {
      font-size: 1.2rem;
      color: #00d9ff;
      margin-top: 1.5rem;
    }
    .btn-record {
      background-color: #28a745;
      border: none;
      padding: 8px 20px;
      font-size: 1rem;
      font-weight: 500;
      border-radius: 50px;
      margin-top: 10px;
    }
    .btn-record:hover {
      background-color: #1e7e34;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <h1 class="text-center mb-4">🤖 Sentiment Analyzer</h1>

    <!-- Text Analysis Form -->
    <form action="/analyze" method="POST" class="mb-4">
      <textarea name="text" class="form-control mb-3" rows="4" placeholder="Type your sentence here..." required>{% if transcribed_text %}{{ transcribed_text }}{% endif %}</textarea>
      <div class="text-center">
        <button type="submit" class="btn btn-analyze">Analyze</button>
      </div>
    </form>

    <!-- Audio Upload -->
    <div class="section-title">🎧 Upload WAV Audio:</div>
    <form action="/upload-audio" method="POST" enctype="multipart/form-data" class="mb-4">
      <input type="file" name="audio_file" accept=".wav" class="form-control mt-2" required>
      <div class="text-center">
        <button type="submit" class="btn btn-record mt-3">Upload & Transcribe</button>
      </div>
    </form>

    {% if transcribed_text %}
      <div class="alert alert-info text-center fs-6">
        Transcribed Text: "{{ transcribed_text }}"
      </div>
    {% endif %}
  </div>
</body>
</html>
